<body>

<header style="padding:26px 0 0">
  <div class="page">
    <a href="/" class="tiny muted">&larr; Pennant</a>
  </div>
</header>

<main class="view live">
  <div class="page" style="padding:40px 0 56px">

    <div id="lock" class="panel" style="max-width:390px;margin:0 auto">
      <h3 style="font-size:20px;margin-bottom:4px">Staff sign in</h3>
      <p class="muted tiny" style="margin-bottom:20px">Stock, pricing and product listings.</p>
      <div class="field">
        <label for="pass">Passcode</label>
        <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
      </div>
      <button class="btn btn-blue btn-block" id="unlock">Sign in</button>
    </div>

    <div id="console" hidden>
      <div class="section-head" style="margin-bottom:22px">
        <h2>Products</h2>
        <div class="toolbar">
          <button class="btn btn-quiet btn-sm" id="exportBtn">Export</button>
          <button class="btn btn-quiet btn-sm" id="importBtn">Import</button>
          <button class="btn btn-quiet btn-sm" id="signOut">Sign out</button>
        </div>
      </div>

      <div class="admin-grid">
        <div class="panel">
          <h3 id="formTitle" style="font-size:18px;margin-bottom:18px">New product</h3>
          <input type="hidden" id="pId">
          <div class="field"><label for="pName">Name</label><input id="pName" placeholder="450W solar panel"></div>
          <div class="field">
            <label for="pCat">Category</label>
            <input id="pCat" list="cats" placeholder="Power">
            <datalist id="cats"></datalist>
          </div>
          <div class="pair">
            <div class="field"><label for="pPrice">Price USD</label><input id="pPrice" type="number" min="0" step="1" placeholder="96"></div>
            <div class="field"><label for="pStock">Stock</label><input id="pStock" type="number" min="0" step="1" placeholder="40"></div>
          </div>
          <div class="field">
            <label for="pImg">Image URL</label>
            <input id="pImg" placeholder="Paste a photo link, or leave blank">
          </div>
          <div class="field"><label for="pDesc">Description</label><textarea id="pDesc" placeholder="One or two lines, plain language"></textarea></div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn btn-blue" id="saveProduct" style="flex:1">Save</button>
            <button class="text-btn" id="resetForm">Clear</button>
          </div>
        </div>

        <div>
          <div class="list" id="adminList"></div>
          <p class="muted tiny" style="margin-top:14px">
            Products are stored server-side in Postgres. Import replaces matching ids and adds new ones; it does not delete products missing from the file.
          </p>
        </div>
      </div>

      <div class="section-head" style="margin:36px 0 22px">
        <h2>Orders</h2>
      </div>
      <div class="list" id="ordersList"></div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const FALLBACK = 'data:image/svg+xml;charset=utf-8,' +
  encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="4" height="3" fill="%23e8e8ed"/></svg>');

function photo(p, w, h){
  if(p.img && p.img.trim()) return p.img.trim();
  return 'https://loremflickr.com/' + w + '/' + h + '/' + p.tags + '?lock=' + p.lock;
}

let products = [];

const $ = sel => document.querySelector(sel);
const money = n => 'USD ' + n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('up');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('up'), 2400);
}

/* API: GET /api/products */
async function loadProducts(){
  const res = await fetch('/api/products', { credentials:'same-origin' });
  if(!res.ok) throw new Error('Failed to load products');
  products = await res.json();
}
/* API: POST /api/products (admin session required) */
async function createProduct(p){
  const res = await fetch('/api/products', {
    method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)
  });
  if(!res.ok) throw new Error('Failed to create product');
  products.push(await res.json());
}
/* API: PUT /api/products/:id (admin session required) */
async function updateProduct(p){
  const res = await fetch('/api/products/' + encodeURIComponent(p.id), {
    method:'PUT', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)
  });
  if(!res.ok) throw new Error('Failed to update product');
  const updated = await res.json();
  products = products.map(x => x.id === updated.id ? updated : x);
}
/* API: DELETE /api/products/:id (admin session required) */
async function deleteProduct(id){
  const res = await fetch('/api/products/' + encodeURIComponent(id), {
    method:'DELETE', credentials:'same-origin'
  });
  if(!res.ok) throw new Error('Failed to delete product');
  products = products.filter(x => x.id !== id);
}

/* --------------------------------------------------------------------------
   Auth
   -------------------------------------------------------------------------- */

function signIn(){
  $('#lock').hidden = true;
  $('#console').hidden = false;
  renderAdmin();
}

$('#unlock').onclick = async () => {
  try{
    const res = await fetch('/api/login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ passcode: $('#pass').value })
    });
    if(res.ok){ signIn(); return; }
    if(res.status === 429){ toast('Too many attempts. Wait a minute and try again.'); return; }
    toast('That passcode is not right');
  }catch(err){
    toast('Could not reach the server. Check your connection and try again.');
  }
};
$('#pass').addEventListener('keydown', e => { if(e.key === 'Enter') $('#unlock').click(); });

$('#signOut').onclick = async () => {
  try{
    await fetch('/api/logout', { method:'POST', credentials:'same-origin' });
  }catch(err){
    toast('Could not reach the server, but you have been signed out here.');
  }
  $('#console').hidden = true;
  $('#lock').hidden = false;
  $('#pass').value = '';
};

/* --------------------------------------------------------------------------
   Products console
   -------------------------------------------------------------------------- */

function renderAdmin(){
  $('#adminList').innerHTML = products.map(p => `
    <div class="list-row">
      <img src="${photo(p, 120, 120)}" alt="" loading="lazy" onerror="this.src='${FALLBACK}'">
      <div class="meta">
        <h4>${esc(p.name)}</h4>
        <div class="sub">${esc(p.cat)} &middot; ${money(p.price)} &middot; ${p.stock} in stock</div>
      </div>
      <button class="text-btn" data-edit="${p.id}">Edit</button>
      <button class="text-btn danger" data-delete="${p.id}">Delete</button>
    </div>
  `).join('');

  $('#cats').innerHTML = [...new Set(products.map(p => p.cat))]
    .map(c => '<option value="' + esc(c) + '">').join('');

  renderOrders();
}

/* API: GET /api/orders (admin session required) */
async function renderOrders(){
  const list = $('#ordersList');
  try{
    const res = await fetch('/api/orders', { credentials:'same-origin' });
    if(!res.ok) throw new Error('Failed to load orders');
    const orders = await res.json();
    if(!orders.length){
      list.innerHTML = '<p class="muted tiny" style="padding:16px">No orders yet.</p>';
      return;
    }
    list.innerHTML = orders.map(o => `
      <div class="list-row">
        <div class="meta">
          <h4>Order #${o.id}</h4>
          <div class="sub">${esc(new Date(o.created_at).toLocaleString())} &middot; ${o.items.length} item${o.items.length === 1 ? '' : 's'} &middot; ${money(o.total)}</div>
        </div>
      </div>
    `).join('');
  }catch(err){
    list.innerHTML = '<p class="muted tiny" style="padding:16px">Could not load orders.</p>';
  }
}

function fillForm(p){
  $('#pId').value    = p ? p.id : '';
  $('#pName').value  = p ? p.name : '';
  $('#pCat').value   = p ? p.cat : '';
  $('#pPrice').value = p ? p.price : '';
  $('#pStock').value = p ? p.stock : '';
  $('#pImg').value   = p ? p.img : '';
  $('#pDesc').value  = p ? p.desc : '';
  $('#formTitle').textContent = p ? 'Edit product' : 'New product';
}

$('#resetForm').onclick = () => fillForm(null);

$('#saveProduct').onclick = async () => {
  const name = $('#pName').value.trim();
  if(!name){ toast('Give the product a name'); $('#pName').focus(); return; }

  const id = $('#pId').value;
  const existing = products.find(x => x.id === id);

  const p = {
    id: id || 'p' + Date.now(),
    name,
    cat:   $('#pCat').value.trim() || 'General',
    price: Number($('#pPrice').value) || 0,
    stock: Number($('#pStock').value) || 0,
    img:   $('#pImg').value.trim(),
    desc:  $('#pDesc').value.trim() || 'Ask us for the full specification.',
    tags:  existing ? existing.tags : (name.split(' ').slice(-2).join(',') || 'product'),
    lock:  existing ? existing.lock : Math.floor(Math.random() * 900) + 1,
    featured: existing ? existing.featured : undefined
  };

  try{
    if(existing) await updateProduct(p); else await createProduct(p);
    fillForm(null);
    renderAdmin();
    toast(existing ? 'Saved' : 'Product added');
  }catch(err){
    toast('Could not save. Sign in again and retry.');
  }
};

$('#adminList').addEventListener('click', async e => {
  const edit = e.target.closest('[data-edit]');
  const del  = e.target.closest('[data-delete]');

  if(edit){
    fillForm(products.find(p => p.id === edit.dataset.edit));
    $('#pName').focus();
  }

  if(del){
    const p = products.find(x => x.id === del.dataset.delete);
    if(confirm('Delete ' + p.name + '?')){
      try{
        await deleteProduct(p.id);
        renderAdmin();
        toast('Deleted');
      }catch(err){
        toast('Could not delete. Sign in again and retry.');
      }
    }
  }
});

$('#exportBtn').onclick = () => {
  const file = new Blob([JSON.stringify(products, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = 'pennant-products.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported');
};

$('#importBtn').onclick = () => {
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = 'application/json';
  picker.onchange = () => {
    const file = picker.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error('wrong shape');
        for(const item of data){
          const exists = products.some(x => x.id === item.id);
          if(exists) await updateProduct(item); else await createProduct(item);
        }
        renderAdmin();
        toast('Imported ' + data.length + ' products');
      }catch(err){
        toast('That file is not a product list, or the import failed partway through');
      }
    };
    reader.readAsText(file);
  };
  picker.click();
};

/* --------------------------------------------------------------------------
   Boot
   -------------------------------------------------------------------------- */

async function boot(){
  try{ await loadProducts(); }catch(err){ toast('Could not load products'); }
  try{
    const res = await fetch('/api/session');
    const data = await res.json();
    if(data.isAdmin) signIn();
  }catch(err){ /* stay signed out */ }
}
boot();
</script>
</body>
</html>
